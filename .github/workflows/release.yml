---
name: Publish SoltrOS Reborn release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run containing LiveISO artifacts
        required: true
        type: string
      release_tag:
        description: Durable GitHub release tag
        required: true
        type: string
      download_base_url:
        description: Canonical external ISO download base URL (for example https://download.soltros.dev/releases/44.0.0)
        required: false
        default: ""
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce publication gate
        run: jq -e '.publication.enabled and .publication.repository_ready' release/release.json >/dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the selected successful build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          test "$(gh run view "${BUILD_RUN_ID}" --json conclusion --jq .conclusion)" = success
          gh run download "${BUILD_RUN_ID}" --dir release-download
      - name: Verify and sign release payload
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          find release-download -type f -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            (cd "$(dirname "${checksum}")" && sha256sum --check "$(basename "${checksum}")")
          done
          find release-download -type f -name '*.iso' -print0 | while IFS= read -r -d '' iso; do
            cosign sign-blob --use-signing-config=false --yes --key env://COSIGN_PRIVATE_KEY --bundle "${iso}.sigstore.json" "${iso}"
            cosign verify-blob --key soltros.pub --bundle "${iso}.sigstore.json" "${iso}"
          done
      - name: Publish durable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        run: |
          mapfile -d '' artifacts < <(find release-download -type f ! -name '*.iso' -print0)
          notes="Universal online installer plus KDE, GNOME, Niri + DMS, and Niri + Noctalia offline LiveISOs. Checksums and signatures are attached here."
          if [[ -n "${DOWNLOAD_BASE_URL}" ]]; then
            notes+=$'\n\nISO downloads: '\"${DOWNLOAD_BASE_URL}\"
          else
            notes+=$'\n\nISO files are intentionally omitted from GitHub Release assets because GitHub limits each asset to 2 GiB. Publish them to the configured external download host and include its immutable versioned URLs.'
          fi
          gh release create "${RELEASE_TAG}" "${artifacts[@]}" \
            --title "SoltrOS Reborn ${RELEASE_TAG}" \
            --notes "${notes}"
