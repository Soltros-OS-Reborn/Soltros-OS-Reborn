[main]
font=JetBrains Mono:size=11
use-bold=yes
prompt="Run: "
terminal=alacritty -e
width=48
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=28
icons-enabled=yes
match-mode=fuzzy

[colors]
background=14161bff
text=dce2ebff
prompt=4c9affff
input=f5f8fcff
match=4c9affff
selection=20242dff
selection-text=f5f8fcff
selection-match=6cadffff
counter=9ca9baff
border=4c9affff

[border]
width=1
radius=6
selection-radius=4
