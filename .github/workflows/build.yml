---
name: Build SoltrOS Reborn
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 0'  # 6am UTC every Sunday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "Gaming-optimized immutable Linux distribution based on Fedora with MacBook support, gaming enhancements, and CachyOS kernel performance"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,gaming,cachyos,macbook,fedora,immutable"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq just ripgrep shellcheck

      - name: Run validation gate
        run: just validate

  prepare:
    name: Prepare desktop matrix
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      desktop_matrix: ${{ steps.matrix.outputs.desktop_matrix }}
      default_tag: ${{ steps.release.outputs.default_tag }}
      fedora_version: ${{ steps.release.outputs.fedora_version }}
      image_registry: ${{ steps.release.outputs.image_registry }}
      kernel_package: ${{ steps.release.outputs.kernel_package }}
      publish_enabled: ${{ steps.release.outputs.publish_enabled }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate desktop matrix
        id: matrix
        run: |
          tools/generate-release-assets.sh --check
          desktop_matrix="$(jq -c . release/generated/desktop-matrix.json)"
          echo "desktop_matrix=${desktop_matrix}" >> "$GITHUB_OUTPUT"

      - name: Load release configuration
        id: release
        run: |
          enabled="$(jq -r '.publication.enabled and .publication.repository_ready' release/release.json)"
          {
            echo "default_tag=$(jq -er '.channels.development' release/release.json)"
            echo "fedora_version=$(jq -er '.product.fedora_version' release/release.json)"
            echo "image_registry=$(jq -er '.publication.registry' release/release.json)"
            echo "kernel_package=$(jq -er '.kernel.package' release/release.json)"
            echo "publish_enabled=${enabled}"
          } >> "$GITHUB_OUTPUT"

  build_push:
    name: Build ${{ matrix.desktop.display_name }} image
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.desktop_matrix) }}

    env:
      DEFAULT_TAG: ${{ needs.prepare.outputs.default_tag }}
      IMAGE_REGISTRY: ${{ needs.prepare.outputs.image_registry }}
      IMAGE_NAME: ${{ matrix.desktop.image_name }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          printf 'IMAGE_REGISTRY=%s\n' "${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          printf 'IMAGE_NAME=%s\n' "${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@main

      - name: Get current date
        id: date
        run: |
          printf 'date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/blob/main/Dockerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            org.soltros.desktop=${{ matrix.desktop.id }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=GPL-3.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build SoltrOS Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Dockerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_REF=${{ matrix.desktop.base_image }}@${{ matrix.desktop.base_digest }}
            DESKTOP_VARIANT=${{ matrix.desktop.id }}
            FEDORA_VERSION=${{ needs.prepare.outputs.fedora_version }}
            KERNEL_PACKAGE=${{ needs.prepare.outputs.kernel_package }}
          oci: false

      - name: Inspect and smoke-test image
        env:
          BUILT_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          podman inspect "${BUILT_IMAGE}" >/dev/null
          podman run --rm "${BUILT_IMAGE}" bootc container lint

      - name: Generate image SPDX and provenance
        env:
          BUILT_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: tools/generate-image-artifacts.sh "${BUILT_IMAGE}" image-artifacts

      - name: Upload image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-metadata-${{ matrix.desktop.id }}-${{ github.sha }}
          path: image-artifacts/*
          if-no-files-found: error
          retention-days: 30

      # Rechunker disabled temporarily due to image reference issues
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: hhd-dev/rechunk@f153348d8100c1f504dec435460a0d7baf11a9d2 # v1.1.1
      #   with:
      #     rechunk: 'ghcr.io/hhd-dev/rechunk:v1.0.1'
      #     ref: "${{ steps.build_image.outputs.image }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     labels: ${{ steps.metadata.outputs.labels }}

      # - name: Load rechunked image in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v2
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: sha-${{ github.sha }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          sbom_file="$(find image-artifacts -type f -name '*.spdx.json' -print -quit)"
          provenance_file="$(find image-artifacts -type f -name '*.provenance.json' -print -quit)"
          jq '.predicate' "${provenance_file}" > /tmp/soltros-provenance-predicate.json
          cosign sign --new-bundle-format=false --use-signing-config=false -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}@${DIGEST}"
          cosign verify --new-bundle-format=false --key soltros.pub "${IMAGE_FULL}@${DIGEST}"
          cosign attest --new-bundle-format=false --use-signing-config=false --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "${sbom_file}" "${IMAGE_FULL}@${DIGEST}"
          cosign attest --new-bundle-format=false --use-signing-config=false --yes --key env://COSIGN_PRIVATE_KEY --type slsaprovenance --predicate /tmp/soltros-provenance-predicate.json "${IMAGE_FULL}@${DIGEST}"
          cosign verify-attestation --new-bundle-format=false --key soltros.pub --type spdxjson "${IMAGE_FULL}@${DIGEST}"
          cosign verify-attestation --new-bundle-format=false --key soltros.pub --type slsaprovenance "${IMAGE_FULL}@${DIGEST}"

      - name: Promote verified image to development channel
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          skopeo copy --all "docker://${IMAGE_FULL}@${DIGEST}" "docker://${IMAGE_FULL}:${DEFAULT_TAG}"
          cosign verify --new-bundle-format=false --key soltros.pub "${IMAGE_FULL}@${DIGEST}"

      - name: Verify GitHub Package is public
        if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          anonymous_auth_file="$(mktemp)"
          trap 'unlink "${anonymous_auth_file}"' EXIT
          printf '{}\n' > "${anonymous_auth_file}"
          skopeo inspect --authfile "${anonymous_auth_file}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" >/dev/null

  build_iso:
    name: Build desktop-selectable LiveISO
    needs: [prepare, build_push]
    if: needs.prepare.outputs.publish_enabled == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@main

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build LiveISO
        env:
          IMAGE_REGISTRY: ${{ needs.prepare.outputs.image_registry }}
          IMAGE_TAG: ${{ needs.prepare.outputs.default_tag }}
          COSIGN: cosign
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: disk_config/build-live-iso.sh artifacts

      - name: Upload LiveISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soltros-live-installer-${{ github.sha }}
          path: |
            artifacts/**/*.iso
            artifacts/**/*.sha256
            artifacts/**/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
